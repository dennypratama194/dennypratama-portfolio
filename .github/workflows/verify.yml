name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: awards_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local_test_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d awards_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:local_test_only@localhost:5432/awards_test
      REQUIRE_DB_TESTS: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:db
      - run: npm run lint
      - run: npm run build
